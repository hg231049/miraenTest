<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Swiper -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=login"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <script src="./js/style.js"></script>
  </head>
  <body>
    <!--- 헤더 --->
    <header>
      <!-- top-bn -->
      <aside class="top-bn" aria-label="프로모션 공지">
        <a href="/event">
          <div class="flex-box">
            <div class="badge-box flex-box">
              <span class="icon"
                ><img src="./img/top-bn-icon.png" alt="사이렌 아이콘"
              /></span>
              선착순
            </div>
            <p class="ff-yg">
              초코 회원이라면<span class="highlight ff-yg">누구나 무료!</span
              >지금 신청
            </p>
          </div>
        </a>
      </aside>
      <div class="header-main">
        <div class="inner">
          <div class="flex-box">
            <div class="logo">
              <a href="/"
                ><img src="./img/main-logo.png" alt="초코 바로가기"
              /></a>
            </div>
            <div class="user-util flex-box">
              <a
                href="https://www.miraenchoco.com/auth/login"
                target="_blank"
                class="btn-login pc-view"
                >로그인</a
              >
              <a
                href="https://www.miraenchoco.com/auth/login"
                target="_blank"
                class="btn-login mo-view"
                ><span class="material-symbols-outlined"> login </span></a
              >

              <a
                href="https://www.mirae-n.com/main/mn-main-01.frm"
                class="partner-logo"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img src="./img/main-ci.png" alt="미래엔 바로가기" />
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!--- 메인 --->
    <main>
      <section class="main-visual">
        <div class="bg" aria-hidden="true">
          <img src="./img/main-visual.png" alt="" />
        </div>
        <h1 class="visual-title">
          <img
            src="./img/main-visual-title.png"
            alt="우리가 기억해야 할 6월 역사 이야기"
          />
        </h1>
        <div class="visual-ch">
          <img src="./img/main-visual-ch.gif" alt="" />
        </div>
      </section>
      <section class="main-box2">
        <div class="paper-info">
          <div class="bg" aria-hidden="true">
            <img src="./img/main-visual-paper.png" alt="" />
          </div>
          <div class="info-box">
            <ul class="flex-box">
              <li>
                <h2 class="ff-yg">수업 내용</h2>
                <p>
                  아이의 생각을 바꾸는 <br />
                  30분의 역사 경험
                </p>
              </li>
              <li>
                <h2 class="ff-yg">참여 선물</h2>
                <p>
                  초간단 댓글&후기 쓰고 <br />
                  특별한 선물 받자♥
                </p>
              </li>
              <li>
                <h2 class="ff-yg">참여 방법</h2>
                <p>
                  한국사·입시 전문 쌤과 <br />
                  ZOOM에서 실시간으로 만나요!
                </p>
              </li>
            </ul>
          </div>
        </div>
        <p class="notice">
          ※ 신청자는 수업 10분 전부터 ‘나의 초코타임 ▶ 수업 들어가기’ 클릭 시,
          참여 가능
        </p>
      </section>
      <section class="main-box3">
        <div class="inner">
          <div class="main-title">
            <h2 class="ff-yg">6월 공휴일</h2>
            <h3>
              <img
                src="./img/news-section-title.png"
                alt="아이는 왜 쉬는 날인지 알고 있을까요"
              />
            </h3>
            <p>현충일, 6·25… 이름은 익숙하지만 의미는 낯선 아이들</p>
          </div>
          <div class="news-box">
            <div class="paper-list">
              <ul>
                <li>
                  <img
                    src="./img/news-bn1.png"
                    alt="3명 중 1명은 별다른 추모나 기념을 하지 않아…"
                  />
                </li>
                <li>
                  <img
                    src="./img/news-bn2.png"
                    alt="현충일이 뭐 하는 날인지는 모르고 그냥 노는 날이라 기뻐요"
                  />
                </li>
                <li>
                  <img src="./img/news-bn3.png" alt="호국영령? 그게 뭐예요?" />
                </li>
              </ul>
            </div>
          </div>
        </div>
      </section>
    </main>
    <aside class="bottom-fixed-bn">
      <div class="inner">
        <a href="#">
          <img
            src="/img/bottom-fixed-bn.png"
            alt="마감 전, 빠르게 초코타임 신청하러 가자"
          />
        </a>
      </div>
    </aside>
  </body>
</html>
