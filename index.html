<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <script src="./js/style.js"></script>
</head>
<body>
    <!--- 헤더 --->
    <header>
        <!-- top-bn -->
        <aside class="top-bn" aria-label="프로모션 공지">
            <a href="/event">
                <div class="flex-box">
                    <div class="badge-box flex-box">
                        <span class="icon"><img src="/img/top-bn-icon.png" alt="사이렌 아이콘"></span>
                        선착순
                    </div>
                    <p class="ff-yg">초코 회원이라면<span class="highlight ff-yg">누구나 무료!</span>지금 신청</p>
                </div>
            </a>
        </aside> 
        <div class="header-main">
            <div class="inner">
                <div class="flex-box">
                    <div class="logo"><a href="/"><img src="./img/main-logo.png" alt="초코 바로가기"></a></div>
                    <div class="user-util flex-box">
                        <a href="https://www.miraenchoco.com/auth/login" target="_blank" class="btn-login">로그인</a>
                        <a href="https://www.mirae-n.com/main/mn-main-01.frm" class="partner-logo" target="_blank" rel="noopener noreferrer">
                            <img src="/img/main-ci.png" alt="미래엔 바로가기" />
                        </a>          
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <!--- 메인 --->
    <main>
        <section class="main-visual">
            <div class="bg" aria-hidden="true"><img src="./img/main-visual.png" alt=""></div >
            <h1 class="visual-title"><img src="./img/main-visual-title.png" alt="우리가 기억해야 할 6월 역사 이야기"></h1>
            <div class="visual-ch"><img src="./img/main-visual-ch.gif" alt=""></div>
        </section>
        <section class="main-box2">
            <div class="inner">
                <div class="paper-info">
                    <div class="bg" aria-hidden="true"><img src="./img/main-visual-paper.png" alt=""></div >
                    <div class="info-box">
                        <ul class="flex-box">
                            <li>
                                <h2 class="ff-yg">수업 내용</h2>
                                <p>
                                    아이의 생각을 바꾸는 <br/>
                                    30분의 역사 경험
                                </p>
                            </li>
                            <li>
                                <h2 class="ff-yg">참여 선물</h2>
                                <p>
                                    초간단 댓글&후기 쓰고 <br/>
                                    특별한 선물 받자♥
                                </p>
                            </li>
                            <li>
                                <h2 class="ff-yg">참여 방법</h2>
                                <p>
                                    한국사·입시 전문 쌤과 <br/>
                                    ZOOM에서 실시간으로 만나요!
                                </p>
                            </li>
                        </ul>
                    </div>
                    <p class="notice">※ 신청자는 수업 10분 전부터 ‘나의 초코타임 ▶ 수업 들어가기’ 클릭 시, 참여 가능</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
